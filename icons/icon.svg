<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background so the icon works as maskable -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="270" r="220" fill="url(#glow)"/>

  <g transform="translate(256 278) scale(1.12) translate(-256 -284)">
  <!-- Floor shadow -->
  <ellipse cx="256" cy="372" rx="170" ry="16" fill="#000" opacity="0.35"/>

  <!-- Handles -->
  <g fill="none" stroke="#fbbf24" stroke-width="22" stroke-linecap="round">
    <path d="M150 220 V200 a26 26 0 0 1 52 0 V220"/>
    <path d="M310 220 V200 a26 26 0 0 1 52 0 V220"/>
  </g>
  <g fill="none" stroke="#b45309" stroke-width="22" stroke-linecap="round" opacity="0.35">
    <path d="M150 220 V214"/>
    <path d="M202 220 V214"/>
    <path d="M310 220 V214"/>
    <path d="M362 220 V214"/>
  </g>

  <!-- Bag body: long, slightly lumpy cylinder -->
  <path d="M120 210
           C 180 202, 332 202, 392 210
           C 448 218, 448 350, 392 358
           C 332 366, 180 366, 120 358
           C 64 350, 64 218, 120 210 Z"
        fill="url(#bag)"/>

  <!-- Drawstring end caps -->
  <ellipse cx="104" cy="284" rx="22" ry="62" fill="url(#cap)"/>
  <ellipse cx="408" cy="284" rx="22" ry="62" fill="url(#cap)"/>
  <circle cx="104" cy="284" r="7" fill="#fcd34d" opacity="0.8"/>
  <circle cx="408" cy="284" r="7" fill="#fcd34d" opacity="0.8"/>

  <!-- Seams -->
  <g fill="none" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11" opacity="0.6">
    <path d="M140 222 C 132 260, 132 310, 140 346"/>
    <path d="M372 222 C 380 260, 380 310, 372 346"/>
    <path d="M150 340 C 220 348, 292 348, 362 340"/>
  </g>

  <!-- Highlight -->
  <path d="M170 228 C 220 222, 292 222, 342 228" fill="none" stroke="#fffbeb" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
